# Dependabot — automatic dependency upgrades.
#
# Weekly checks, one PR per dependency. Each PR is auto-merged by the
# "auto-merge" job in .github/workflows/ci.yml once typecheck, build and
# tests pass.
version: 2

updates:
  # npm packages (package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    # The React Router + Vite stack is peer-locked: bumping one piece alone
    # makes `npm ci` fail with ERESOLVE (@react-router/dev@8 needs vite ^7||^8,
    # vite-tsconfig-paths pins its own vite range). These upgrade together in
    # one PR; everything else stays one PR per update.
    groups:
      react-router-vite:
        patterns:
          - "react-router"
          - "@react-router/*"
          - "vite"
          - "vite-tsconfig-paths"

  # Node base image in the multi-stage Dockerfile (ARG NODE_VERSION=22)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # Node images used by the dev services in docker-compose.yml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

  # Action versions referenced in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"