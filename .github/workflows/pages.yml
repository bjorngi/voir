name: pages

# Publishes the visual-review gallery (site/) to GitHub Pages.
#
# The gallery is generated locally with `npm run shots:publish`
# (bin/shots.ts walks the running mock stack across every display in
# test/displays.ts) and committed under site/. This workflow only ships
# it — it does not run the app, so a Pages deploy never depends on a dev
# server, an agent binary, or a browser download.
#
# Pages must be enabled with "Build and deployment → Source: GitHub
# Actions" (done once via the API; see the repo's Pages settings).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages resolves the artifact as soon as it starts and has been
      # seen racing the upload ("Found 0 artifact(s)" seconds after a
      # successful 2.2 MB upload — twice in ten minutes, green on rerun).
      # Poll the artifacts API until the upload is visible, so the deploy
      # step cannot start before it.
      - name: Wait for the gallery artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"                   --jq '.artifacts | map(select(.name == "github-pages")) | length')
            if [ "$n" -gt 0 ]; then
              echo "artifact visible after ${i} checks"
              exit 0
            fi
            sleep 3
          done
          echo "artifact never became visible" >&2
          exit 1
      # deploy-pages occasionally answers "Found 0 artifact(s)" seconds
      # after a successful upload, while the artifacts API lists it (the
      # same query returns it a moment later). Retry once instead of
      # needing a human to hit "re-run".
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before the retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 25
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Fail if both deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: |
          echo "both deploy attempts failed" >&2
          exit 1
