# ──────────────────────────────────────────────────────────────────────
# Voir — docker compose
#
# Usage:
#   cp .env.example .env   # edit if you want non-defaults
#   docker compose up --build
#   open http://localhost:${PORT:-10001}
#
# Maps the container's port 9000 to ${PORT:-10001} on the host so
# acp-spawn (running on the host) can register folders against it.
#
# NOTE: this is fine if vous/mise both run on the same host, but
# the ACP agent (which acp-spawn spawns on the host) needs to be
# reachable from inside the container too — for that to work, the
# container must use `network_mode: host` instead of the port map.
# ──────────────────────────────────────────────────────────────────────
services:
  voir:
    build:
      context: .
      dockerfile: Dockerfile
    image: voir:latest
    container_name: voir
    restart: unless-stopped
    environment:
      # Force these regardless of what's in .env.
      NODE_ENV: production
    ports:
      - "${PORT:-10001}:9000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||9000)+'/api/folders').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
